
name: Build Bedrock Forge AI APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'BedrockForgeAI_Source.zip'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract source project
        run: unzip BedrockForgeAI_Source.zip -d .

      - name: Build APK
        run: gradle -p BedrockForgeAI assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BedrockForgeAI-debug-apk
          path: BedrockForgeAI/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
